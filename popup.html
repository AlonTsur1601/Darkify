<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<title>Darkify</title>
<style>
  * { box-sizing: border-box; }
  body {
    width: 260px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding: 16px;
    background: #1e1e1e;
    color: #eee;
    margin: 0;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 14px;
    font-weight: 600;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    gap: 10px;
  }
  .row span {
    font-size: 13px;
  }
  .site {
    font-size: 11px;
    color: #999;
    margin-bottom: 8px;
    word-break: break-all;
    background: #2a2a2a;
    padding: 6px 8px;
    border-radius: 6px;
    direction: ltr;
    unicode-bidi: plaintext;
    text-align: left;
  }
  .warning {
    font-size: 12px;
    color: #ff6b6b;
    margin-bottom: 14px;
    padding: 6px 8px;
    background: rgba(255, 107, 107, 0.1);
    border-radius: 6px;
  }

  /* Toggle switch */
  label.switch {
    position: relative;
    display: inline-block;
    width: 40px;
    height: 22px;
    flex-shrink: 0;
  }
  label.switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #555;
    transition: background-color .2s;
    border-radius: 22px;
  }
  .slider::before {
    position: absolute;
    content: "";
    height: 16px;
    width: 16px;
    left: 3px;
    top: 3px;
    background-color: white;
    transition: transform .2s;
    border-radius: 50%;
  }
  input:checked + .slider {
    background-color: #4caf50;
  }
  input:checked + .slider::before {
    transform: translateX(18px);
  }

  /* Dropdown */
  select#siteMode {
    appearance: none;
    -webkit-appearance: none;
    background: #2a2a2a;
    color: #eee;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 6px 28px 6px 10px;
    font-size: 13px;
    cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M0 0l5 6 5-6z' fill='%23aaaaaa'/></svg>");
    background-repeat: no-repeat;
    background-position: right 10px center;
  }
  select#siteMode:disabled {
    opacity: 0.5;
    cursor: default;
  }
  select#siteMode:focus {
    outline: none;
    border-color: #4caf50;
  }
</style>
</head>
<body>
  <h1>Darkify</h1>
  <div class="row">
    <span>Extension enabled</span>
    <label class="switch">
      <input type="checkbox" id="globalToggle">
      <span class="slider"></span>
    </label>
  </div>
  <div class="site" id="siteName"></div>
  <div class="warning" id="siteWarning" style="display:none;"></div>
  <div class="row">
    <span>For this site:</span>
    <select id="siteMode">
      <option value="auto">Automatic</option>
      <option value="on">Always force dark</option>
      <option value="off">Never touch</option>
    </select>
  </div>
  <script src="popup.js"></script>
</body>
</html>
