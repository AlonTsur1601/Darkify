name: Package extension

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read extension version
        id: version
        shell: bash
        run: echo "value=$(node -p \"require('./manifest.json').version\")" >> "$GITHUB_OUTPUT"
      - name: Create Chrome package
        shell: bash
        run: |
          mkdir -p dist
          zip -r "dist/Darkify-v${{ steps.version.outputs.value }}.zip" \
            manifest.json background.js content.js dark.css popup.html popup.js icons
      - uses: actions/upload-artifact@v4
        with:
          name: Darkify-v${{ steps.version.outputs.value }}
          path: dist/Darkify-v${{ steps.version.outputs.value }}.zip
      - name: Attach package to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" \
            "dist/Darkify-v${{ steps.version.outputs.value }}.zip" --clobber
